version: 2
updates:
  - package-ecosystem: npm
    directory: /risk-fork
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /risk-fork/sdk-qualification
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    groups:
      codeql-actions:
        patterns:
          - github/codeql-action/*
    schedule:
      interval: weekly
